<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff0f5">
  <meta name="description" content="A little world made with love for Amal.">
  <title>For Amal, with love ♥</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="ambient ambient-one"></div><div class="ambient ambient-two"></div>
  <main>
    <section id="login-screen" class="login-screen">
      <div class="tiny-heart">♥</div>
      <p class="eyebrow">A LITTLE PLACE ON THE INTERNET</p>
      <h1>Just for <em>Amal</em></h1>
      <p class="intro">A tiny world made from my favourite memories, little surprises, and all the things I don't say enough. ♡</p>
      <form id="login-form" class="login-card">
        <label for="passcode">Our secret date</label>
        <div class="password-wrap">
          <input id="passcode" type="password" inputmode="numeric" autocomplete="current-password" placeholder="YYYY-MM-DD" required>
          <span aria-hidden="true">♡</span>
        </div>
        <button class="primary-btn" type="submit">Unlock our little world <span>→</span></button>
        <p id="login-error" class="error" role="alert"></p>
        <p class="hint">Hint: the day our story got a new chapter.</p>
      </form>
      <p class="signature">made with love by hamchouchi</p>
    </section>

  </main>
  <script src="/login.js"></script>
</body>
</html>
